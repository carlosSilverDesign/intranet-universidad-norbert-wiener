<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotocheck Digital - Docente | Universidad Norbert Wiener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f0f4f8;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px 10px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* Envoltorio centrado */
    .fotocheck-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto;
      width: 100%;
      max-width: 360px;
    }

    /* Barra superior con botón volver */
    .top-actions {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #0F848F;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(15, 132, 143, 0.12);
      border: 1px solid #d5e2ea;
      transition: all 0.2s ease;
    }

    .btn-volver:hover {
      background: #0F848F;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 132, 143, 0.24);
      transform: translateY(-1px);
    }

    .btn-volver svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Contenedor Principal del Fotocheck (Desktop Look & Feel Oficial) */
    .main-container {
      border-radius: 1.5rem;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 800px;
      background-color: #0F848F;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .yelllow-bar {
      height: 8px;
      background-color: #F9B926;
      width: 100%;
      flex-shrink: 0;
    }

    .pattern {
      width: 100%;
      flex-shrink: 0;
      line-height: 0;
    }

    .pattern img {
      width: 100%;
      display: block;
    }

    .content-white {
      background-color: white;
      width: 100%;
      flex: 1;
      border-radius: 24px 24px 0 0;
      margin-top: -16px;
    }

    .bar-Turq-800 {
      display: none;
    }

    /* Capa de contenido Desktop */
    .content {
      width: 100%;
      height: calc(100% - 32px);
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      left: 0;
      top: 32px;
      z-index: 10;
    }

    .logo {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .logo img {
      height: 38px;
      display: block;
    }

    .id-photo {
      width: 220px;
      height: 220px;
      border-radius: 64px;
      border: 1px solid #C6CFD7;
      background: #e9ecef;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .id-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .user-name {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .name {
      font-family: 'Lato', sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 32px;
      color: #111827;
    }

    .last-name {
      font-family: 'Lato', sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 24px;
      color: #1f2937;
    }

    .carrera {
      padding: 8px 24px;
      color: white;
      background-color: #09A5B1;
      border-radius: 4px;
      font-family: 'Lato', sans-serif;
      font-size: 20px;
      font-style: normal;
      font-weight: 700;
      line-height: 30px;
      letter-spacing: 0.1px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .bar-code {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .barcode-img {
      width: 270px;
      max-width: 82%;
      height: 85px;
      object-fit: contain;
      display: block;
    }

    .barcode-code {
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #1a202c;
      letter-spacing: 0.5px;
    }

    .time {
      color: white;
      font-size: 15px;
      font-style: normal;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: 0.1px;
      padding: 6px 14px;
      border-radius: 4px;
      background: #222222;
      font-variant-numeric: tabular-nums;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .active-status {
      color: white;
      text-align: center;
      width: 100%;
      background-color: hsla(146, 56%, 45%, 1);
      padding: 10px 12px;
      font-family: 'Roboto', sans-serif;
      font-size: 20px;
      font-style: normal;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      margin-top: auto;
      flex-shrink: 0;
    }

    /* =========================================================================
       ADAPTACIÓN MOBILE: TAMAÑO ÓPTIMO Y LEGIBLE PARA DOCENTES
       Mantiene los elementos grandes y legibles (foto, nombres, código)
       y únicamente reduce la altura sobrante del contenedor para que
       el indicador 'Activo' sea siempre visible sin scroll.
       ========================================================================= */
    @media (max-width: 600px), (max-height: 840px) and (max-width: 900px) {
      body {
        padding: 8px 10px;
      }

      .top-actions {
        margin-bottom: 8px;
      }

      .btn-volver {
        padding: 6px 14px;
        font-size: 13px;
      }

      .btn-volver svg {
        width: 15px;
        height: 15px;
      }

      /* Altura reducida sin espacios muertos para que 'Activo' suba y se vea */
      .main-container {
        height: 675px;
        max-height: calc(100dvh - 48px);
        min-height: 560px;
        border-radius: 1.5rem;
      }

      .content {
        top: 20px;
        height: calc(100% - 20px);
      }

      .logo {
        margin-bottom: 12px;
      }

      .logo img {
        height: 34px;
      }

      /* Foto grande y nítida */
      .id-photo {
        width: 195px;
        height: 195px;
        border-radius: 56px;
        margin-bottom: 10px;
      }

      /* Nombres con tipografía grande y clara para alta legibilidad */
      .user-name {
        margin-bottom: 10px;
        gap: 3px;
      }

      .name {
        font-size: 26px;
        line-height: 30px;
      }

      .last-name {
        font-size: 22px;
        line-height: 24px;
      }

      .carrera {
        padding: 6px 22px;
        font-size: 18px;
        line-height: 26px;
        margin-bottom: 12px;
      }

      /* Código de barras de buen tamaño para fácil escaneo */
      .bar-code {
        gap: 5px;
        margin-bottom: 10px;
      }

      .barcode-img {
        width: 250px;
        max-width: 80%;
        height: 70px;
      }

      .barcode-code {
        font-size: 15px;
      }

      .time {
        font-size: 14px;
        line-height: 18px;
        padding: 5px 14px;
        margin-bottom: 14px;
      }

      .active-status {
        padding: 10px 12px;
        font-size: 19px;
        line-height: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="fotocheck-wrapper">
    <!-- Botón Volver -->
    <div class="top-actions">
      <a href="mis-datos.html" class="btn-volver" title="Volver a Mi Perfil">
        <svg viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
        <span>Volver a Mi Perfil</span>
      </a>
    </div>

    <!-- Fotocheck Card Oficial -->
    <div class="main-container">
      <div class="yelllow-bar"></div>
      <div class="pattern">
        <img src="./img/pattern-wiener.png" alt="Patrón Wiener">
      </div>
      <div class="content-white"></div>
      <div class="bar-Turq-800"></div>
      <div class="content">
        <div class="logo">
          <img src="./img/Logo-Wiener-white.svg" alt="Universidad Norbert Wiener">
        </div>
        <div class="id-photo">
          <img src="./img/docente-avatar.jpg" alt="Foto Jonah Miguel Asensio Peña">
        </div>
        <div class="user-name">
          <div class="name">Jonah Miguel</div>
          <div class="last-name">Asensio Peña</div>
        </div>
        <div class="carrera">Docente</div>
        <div class="bar-code">
          <img src="./img/barcode-wiener.png" alt="Código de barras" class="barcode-img">
          <span class="barcode-code">Código: 10006551</span>
        </div>
        <div class="time" id="currentTime">
          Hora: 12:35:06
        </div>
        <div class="active-status">
          Activo
        </div>
      </div>
    </div>
  </div>

  <script>
    // Reloj digital dinámico en tiempo real
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const el = document.getElementById('currentTime');
      if (el) {
        el.textContent = `Hora: ${hours}:${minutes}:${seconds}`;
      }
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Permitir volver con tecla Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.location.href = 'mis-datos.html';
      }
    });
  </script>
</body>

</html>
